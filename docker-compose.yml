# This file is for TrueNAS deployment — uses pre-built images from GHCR
# Do: cp docker-compose.truenas.yml docker-compose.yml on your TrueNAS host
services:
  postgres:
    image: postgres:16-alpine
    container_name: nucleus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nucleus}
      POSTGRES_USER: ${POSTGRES_USER:-nucleus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/FSec-Data/data/nucleus/postgres:/var/lib/postgresql/data
      - /mnt/FSec-Data/data/nucleus/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nucleus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nucleus}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    image: ghcr.io/liamlane/nucleus-backend:latest
    container_name: nucleus-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_DB: ${POSTGRES_DB:-nucleus}
      POSTGRES_USER: ${POSTGRES_USER:-nucleus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PIN_HASH: ${PIN_HASH}
      PORT: 3001
    volumes:
      - /mnt/FSec-Data/data/nucleus/extra-routes/trackers.js:/app/src/routes/trackers.js
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nucleus-net
  frontend:
    image: ghcr.io/liamlane/nucleus-frontend:latest
    container_name: nucleus-ui
    restart: unless-stopped
    networks:
      - nucleus-net
  nginx:
    image: nginx:alpine
    container_name: nucleus-proxy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - /mnt/FSec-Data/data/nucleus/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nucleus-net
networks:
  nucleus-net:
    driver: bridge