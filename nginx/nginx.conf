events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:3001;
  }

  upstream frontend {
    server frontend:80;
  }

  server {
    listen 80;

    # ── Body size limit ─────────────────────────────────────────────────
    # Must be >= express body limit (2mb). Acts as the outer gate.
    client_max_body_size 2m;

    # ── Security headers ─────────────────────────────────────────────────
    # Prevent this app from being embedded in iframes on other domains
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options    "nosniff"              always;
    # Enable XSS filter in older browsers
    add_header X-XSS-Protection          "1; mode=block"        always;
    # Control referrer info sent on navigation
    add_header Referrer-Policy           "strict-origin"        always;
    # Restrict browser features
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    # Prevent caching of API responses at the proxy layer
    add_header Cache-Control             "no-store"             always;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
      text/plain
      text/css
      application/json
      application/javascript
      text/xml
      application/xml
      text/javascript;

    # ── API proxy ──────────────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://backend/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        'upgrade';
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 120s;   # Reduced from 300s — analytics queries shouldn't need 5 min
    }

    # ── Frontend ───────────────────────────────────────────────────────────
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host       $host;
      proxy_cache_bypass $http_upgrade;

      # Cache static frontend assets aggressively — they're fingerprinted by Vite
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        proxy_pass http://frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }
    }
  }
}
